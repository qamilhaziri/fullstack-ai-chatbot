<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .message-content {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message-content code {
            background-color: #f0f0f0;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: monospace;
        }
    </style>
</head>
<body class="bg-slate-300 h-screen flex flex-col">
<div class="container mx-auto p-4 flex-1 flex flex-col">

    <div class="flex items-center justify-center gap-4 ">
        <h1 class="text-2xl font-bold mb-4 text-center text-gray-800">Student ChatApp</h1>
        <img src="javaLogo.png" width="150px" height="100px" class="mb-2"><img>
    </div>

    <div class="flex-1 overflow-y-auto mb-4 p-4 bg-white rounded-lg shadow">
        <div id="chat-messages" class="space-y-4"></div>
    </div>

    <form id="chat-form" class="flex items-center">
        <input type="text"
               id="message-input"
               name="message"
               placeholder="Type your message..."
               class="flex-1 p-2 border border-gray-300 rounded-l-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               required
        >

        <button type="submit"
                class="bg-blue-500 text-white px-4 py-2 rounded-r-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">Send</button>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
